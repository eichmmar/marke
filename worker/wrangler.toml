name = "marke-coach"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Eigene Domain (Zone vka-albis.ch im selben Cloudflare-Konto; DNS + Zertifikat
# legt Cloudflare automatisch an). Die alte workers.dev-Adresse ist abgeschaltet.
workers_dev = false
routes = [
  { pattern = "marke-coach.vka-albis.ch", custom_domain = true },
]

# Modell & erlaubte Origins (per `wrangler.toml` änderbar, kein Code-Edit nötig).
# Modell-Alternativen: claude-haiku-5-5 (günstiger) · claude-opus-5-5 (stärker).
[vars]
MODEL = "claude-sonnet-5-5"
ALLOWED_ORIGINS = "https://marke.verkehrskadetten.ch,http://localhost:8080,http://127.0.0.1:8080"

# Rate-Limit pro IP: 20 Anfragen / 60 s (period muss 10 oder 60 sein).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secret (nicht hier eintragen!) setzen mit:
#   npx wrangler secret put ANTHROPIC_API_KEY
