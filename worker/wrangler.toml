name = "marke-coach"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Modell & erlaubte Origins (per `wrangler.toml` änderbar, kein Code-Edit nötig).
# Modell-Alternativen: claude-haiku-4-5 (günstiger) · claude-opus-4-8 (stärker).
[vars]
MODEL = "claude-sonnet-4-6"
ALLOWED_ORIGINS = "https://marke.verkehrskadetten.ch,http://localhost:8080,http://127.0.0.1:8080"

# Rate-Limit pro IP: 20 Anfragen / 60 s (period muss 10 oder 60 sein).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secret (nicht hier eintragen!) setzen mit:
#   npx wrangler secret put ANTHROPIC_API_KEY
