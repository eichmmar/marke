        - listitem [ref=f1e230]:
          - text: —
          - strong [ref=f1e231]: Weiss und Schwarz
          - text: — für «CH»/Region, Hintergrund, das «V» und für Text.
        - listitem [ref=f1e232]:
          - text: — Text steht in Schwarz oder Weiss,
          - strong [ref=f1e233]: nie
          - text: in Sekundärfarbe. Gedämpftes Grau
          - code [ref=f1e234]: "#6B6B6B"
