  - generic [ref=f1e38]:
    - paragraph [ref=f1e39]: Markenidentität
    - heading "Warum eine Marke?" [level=2] [ref=f1e40]
    - paragraph [ref=f1e41]:
      - text: Über 20 Abteilungen in der ganzen Schweiz tragen dieselbe orange Uniform — ein einheitliches Erscheinungsbild schafft Wiedererkennung und Vertrauen bei Jugendlichen, Eltern, Behörden und Veranstaltern. Der Claim
      - strong [ref=f1e42]: «Jugend bewegt Verkehr»
      - text: "verbindet drei Ebenen:"
      - strong [ref=f1e43]: Jugend
      - text: als Herz der Organisation,
      - strong [ref=f1e44]: bewegt
      - text: als sichtbare Wirkung und
      - strong [ref=f1e45]: Verkehr
      - text: als Einsatzfeld und Symbol für Ordnung, Sicherheit und gesellschaftliches Zusammenwirken.
    - generic [ref=f1e46]:
      - generic [ref=f1e47]:
        - paragraph [ref=f1e48]: Was wir konkret tun
        - paragraph [ref=f1e49]: Wir sichern Verkehr und Zugänge bei Veranstaltungen — verlässlich, wirksam, ehrenamtlich.
      - generic [ref=f1e50]:
        - paragraph [ref=f1e51]: Wie wir es tun
        - paragraph [ref=f1e52]: Mit geschulten Jugendlichen, klarem Ablauf, menschlichem Auftreten — und regionaler Verankerung.
      - generic [ref=f1e53]:
        - paragraph [ref=f1e54]: Warum wir tun, was wir tun
        - paragraph [ref=f1e55]: Weil gesellschaftliches Miteinander sichere Mobilität und Verantwortung braucht.
