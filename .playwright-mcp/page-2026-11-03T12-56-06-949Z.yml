          - strong [ref=f1e237]: Verkehr
          - text: ». Nie für Fliesstext, Links, Buttons, Navigation, Labels oder ganze Titel — Orange auf Weiss hat nur 2,98:1 Kontrast, WCAG AA verlangt für normalen Text 4,5:1.
